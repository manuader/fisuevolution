# Fuente de verdad del .xcodeproj — regenerar con `xcodegen generate`.
# El .xcodeproj NO se versiona (ver .gitignore).
name: FisuEvolution
options:
  bundleIdPrefix: com.manuader
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
packages:
  EconomyKit:
    path: Packages/EconomyKit
  # ÚNICA dependencia externa del proyecto, y es una excepción documentada a
  # "sin librerías de terceros" (Docs/ads-integration.md): Apple no ofrece red
  # publicitaria, así que monetizar con ads obliga a un SDK ajeno.
  #
  # El producto `GoogleMobileAds` arrastra `GoogleUserMessagingPlatform` como
  # dependencia transitiva — por eso el consentimiento (UMP, obligatorio en la
  # UE) NO necesita una segunda entrada acá: alcanza con
  # `import UserMessagingPlatform`.
  #
  # Es un binaryTarget (xcframework firmado por Google), no fuente: no se
  # compila con nuestras flags, así que `SWIFT_STRICT_CONCURRENCY: complete` no
  # lo alcanza. Lo que sí nos toca es que su API está anotada `NS_SWIFT_UI_ACTOR`
  # (o sea `@MainActor`) en todo lo que presenta: `AdMobAdsProvider` es
  # `@MainActor` entero por eso, no por costumbre.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Sólo para los HEADERS C del SDK: desde Xcode 26.6, warnings-as-errors
    # alcanza al clang importer cuando precompila módulos del sistema, y
    # StoreKitTest.framework (SDK 26.5) usa API deprecada de su propio
    # framework — el build moría en un header de Apple. Los warnings de
    # NUESTRO Swift siguen siendo errores; esto no afloja "cero warnings".
    OTHER_SWIFT_FLAGS: -Xcc -Wno-error=deprecated-declarations
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Development team (Personal Team gratis de Manuel Ader). Necesario para
    # firmar en dispositivo físico; el simulador no lo requiere. Va acá y no en la
    # UI de Xcode porque el .xcodeproj se regenera con `xcodegen generate`.
    DEVELOPMENT_TEAM: 2TS7P7VDQJ
    # Sin AppIntents en ningún target; silencia el aviso del metadata processor
    # para que el criterio "cero warnings" sea chequeable por grep.
    ENABLE_APP_INTENTS_METADATA: NO
targets:
  FisuEvolution:
    type: application
    platform: iOS
    sources:
      - path: FisuEvolution
        # `Info.plist` es INPUT del build (INFOPLIST_FILE), no un recurso. Sin
        # excluirlo, XcodeGen lo encuentra al escanear la carpeta y lo agrega
        # también a Copy Bundle Resources: el resultado es un segundo
        # Info.plist crudo dentro del .app, pisando al compilado.
        excludes:
          - Info.plist
      # El .storekit viaja en el bundle para que la tienda local funcione en
      # builds lanzadas SIN Xcode (simctl, tocar el icono): el
      # `storeKitConfiguration` del scheme sólo se inyecta cuando Xcode lanza
      # la app, y sin él StoreKit devuelve el catálogo vacío — la tienda
      # mostraba "sin conexión" para siempre (lo vio el dueño, 2026-08-18).
      # Quien lo usa es el bootstrap DEBUG de `StoreManager` (SKTestSession);
      # en Release el archivo es un JSON inerte de ~4 KB.
      - path: StoreKitConfig/FisuEvolution.storekit
        buildPhase: resources
    dependencies:
      - package: EconomyKit
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manuader.fisuevolution
        GENERATE_INFOPLIST_FILE: YES
        # Los dos convivien a propósito: `FisuEvolution/Info.plist` es la BASE y
        # las claves generadas + los `INFOPLIST_KEY_*` se suman encima. Existe
        # sólo para las claves que la whitelist de Xcode no puede expresar
        # (`GADApplicationIdentifier`); el porqué completo está adentro del
        # archivo. VERIFICADO en el Info.plist compilado.
        INFOPLIST_FILE: FisuEvolution/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # ⚠️ Va acá, en el TARGET, y no alcanza con el `settings.base` de arriba.
        # Medido con `xcodebuild -showBuildSettings`: con la clave sólo en base,
        # el valor efectivo del target salía `1,2` igual, y el binario se armaba
        # con `UIDeviceFamily = [1, 2]`.
        #
        # Eso hacía que Apple rechazara el bundle en Validate con el error 90474:
        # un target que incluye iPad tiene que declarar las CUATRO orientaciones
        # para el multitasking, y este juego es portrait —el tablero de SpriteKit
        # se diseñó vertical—, así que agregar landscape sería mentirle a Apple
        # sobre algo que no funciona. La salida correcta es la que el proyecto ya
        # decía querer: sólo iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        # ⚠️ Esta clave sola NO oculta nada, y durante meses no ocultó nada.
        # `UIStatusBarHidden` sólo se respeta si `UIViewControllerBasedStatusBarAppearance`
        # es NO, y esa viene en YES de fábrica: manda el view controller, no el
        # Info.plist. Y la clave compañera **no se puede escribir desde acá** —
        # Xcode sólo traduce a Info.plist una whitelist de 85 `INFOPLIST_KEY_*`
        # (medida sobre Xcode 16.4: de la barra de estado sólo conoce
        # `UIStatusBarHidden` y `UIStatusBarStyle`). Puesta igual, se queda en el
        # .pbxproj y el Info.plist compilado sale sin ella, en silencio.
        #
        # Así que quien oculta la barra de verdad es `RootView.statusBarHidden(true)`,
        # que es el mecanismo que el default (VC-based) espera. Esta clave se queda
        # porque describe la intención y cubre la ventana de lanzamiento, pero
        # **no es la que manda**: si algún día vuelve a aparecer el reloj, el
        # lugar donde mirar es `RootView`, no este archivo.
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # El nombre de la home screen. Es el BASE (castellano); el inglés lo
        # pone `Resources/InfoPlist.xcstrings` con `CFBundleDisplayName` =
        # "HoboEvolution" (decisión del dueño, 2026-09-02: FisuEvolution para
        # mercados hispanohablantes, HoboEvolution para el resto).
        # ⚠️ Esto NO es el nombre de App Store Connect, que se carga por locale
        # en la ficha (ver Distribution/store-metadata.md).
        INFOPLIST_KEY_CFBundleDisplayName: FisuEvolution
        # Compliance de exportación. La app no usa criptografía propia ni no
        # exenta: sólo HTTPS del sistema (y, con ads, el SDK de Google). Sin
        # esta clave App Store Connect pregunta el compliance en CADA subida y
        # el build queda en "Missing Compliance" sin poder mandarse a review.
        # ⚠️ Va con el prefijo INFOPLIST_KEY_ porque `GENERATE_INFOPLIST_FILE`
        # está en YES: una clave pelada acá se queda en el .pbxproj y NO llega
        # al Info.plist (es la misma trampa de UIStatusBarHidden, arriba).
        # VERIFICADO en el Info.plist compilado, no asumido — ver §7 del handoff.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # El texto del diálogo de App Tracking Transparency. Va localizado por
        # `Resources/InfoPlist.xcstrings` (clave `NSUserTrackingUsageDescription`);
        # este valor es el base/castellano.
        # ⚠️ Sin esta clave el prompt de ATT NO aparece y `requestTrackingAuthorization`
        # devuelve `.denied` sin preguntar — se ve como "el usuario siempre
        # rechaza", que es un diagnóstico difícil porque no falla nada.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: Usamos tu identificador de publicidad para mostrarte anuncios más relevantes. Si preferís que no, los anuncios se siguen viendo, sólo que sin personalizar.
        # Apple quema el número de build para siempre: del 1 al 4 se subieron
        # con la 1.0.0 (el 4 es el publicado). Reusarlo hace fallar la subida.
        CURRENT_PROJECT_VERSION: "5"
        MARKETING_VERSION: "2.0.0"
      configs:
        Debug:
          # StoreKitTest (la tienda local DEBUG de `StoreManager`) vive en
          # `$(SDKROOT)/Developer/Library/Frameworks`, fuera de los search
          # paths de un target de app. Sólo Debug lo importa (`#if DEBUG`),
          # así que sólo Debug lo busca; en Release no hay import y el
          # autolink —que sigue al import— tampoco lo linkea.
          ENABLE_TESTING_SEARCH_PATHS: YES
          # ⚠️ WEAK y no fuerte: StoreKitTest depende de XCTest, que fuera del
          # entorno de tests (o de un bundle que los embeba) NO está en ningún
          # rpath — con el link fuerte, una instalación a pelo por `simctl`
          # ABORTABA EN DYLD al lanzar ("Library not loaded: XCTest", medido
          # 2026-08-18). Débil, dyld tolera la falta y `StoreManager` pregunta
          # por la clase antes de tocarla: sin frameworks la app arranca igual
          # y la tienda cae al camino de siempre.
          OTHER_LDFLAGS: -weak_framework StoreKitTest
          # Y estos DOS rpaths son los que hacen que la tienda local funcione
          # también instalada a pelo: XCTest (la dependencia de StoreKitTest) y
          # sus re-exports (XCTestCore, XCUIAutomation) viven en el platform
          # dir del HOST, que un proceso del simulador puede cargar — es
          # exactamente lo que el runner de tests inyecta por DYLD_* cuando
          # corre la suite. Rutas absolutas de esta máquina horneadas en el
          # binario de DEBUG: en otra máquina con Xcode en otro lado, el weak
          # link de arriba degrada limpio (app viva, tienda sin catálogo).
          LD_RUNPATH_SEARCH_PATHS: $(inherited) $(PLATFORM_DIR)/Developer/Library/Frameworks $(PLATFORM_DIR)/Developer/Library/PrivateFrameworks
    # Entitlements futuros (F6, detrás de feature flags — NO habilitar antes):
    #   com.apple.developer.game-center, iCloud/CloudKit container
  FisuEvolutionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FisuEvolutionTests
      # SKTestSession(configurationFileNamed:) busca el .storekit en el bundle de tests.
      - path: StoreKitConfig/FisuEvolution.storekit
        buildPhase: resources
    dependencies:
      - target: FisuEvolution
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FisuEvolutionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FisuEvolutionUITests
    dependencies:
      - target: FisuEvolution
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FisuEvolution
schemes:
  FisuEvolution:
    build:
      targets:
        FisuEvolution: all
    run:
      config: Debug
      # ⚠️ **Esta línea no alcanza para que ande la tienda local en Xcode
      # 26.6**, y el comentario que había acá antes decía que sí. Lo que se
      # había verificado era el .xcscheme GENERADO —que la ruta resolviera a un
      # archivo existente—, no una corrida. Medido el 2026-09-22 corriendo la
      # app desde la acción Run: Xcode loguea
      #
      #     [DTStoreKitService] Remove configuration called for com.manuader.fisuevolution
      #
      # o sea que descarta la referencia y BORRA la configuración. Pasa igual
      # con las tres formas de ruta: `../../../` (relativa al .xcscheme, que es
      # la que sale de acá y apunta al archivo de verdad), `StoreKitConfig/...`
      # (relativa al proyecto) y una ruta absoluta. También pasa con el
      # .storekit sacado de los Copy Bundle Resources, que es el requisito que
      # documenta rules_xcodeproj.
      #
      # El control que descarta "Xcode no leyó el esquema": un
      # `<CommandLineArgument>` agregado a mano en el MISMO `<LaunchAction>` sí
      # llega al proceso (se ve en `ps`). Xcode parsea el bloque y honra a los
      # hermanos; a este elemento lo tira. Ojo también con el método: Xcode
      # cachea el esquema al abrir el proyecto y NO relee el disco, así que
      # cualquier medición de esto exige reabrir (o reiniciar) Xcode.
      #
      # Queda porque es la forma que documenta Apple y no cuesta nada, pero
      # para tener catálogo local hay que elegir el archivo a mano una vez en
      # Edit Scheme ▸ Run ▸ Options ▸ StoreKit Configuration — y repetirlo
      # después de cada `xcodegen generate`, que pisa el .xcscheme.
      storeKitConfiguration: ../StoreKitConfig/FisuEvolution.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FisuEvolutionTests
        - FisuEvolutionUITests
