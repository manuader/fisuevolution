# Fuente de verdad del .xcodeproj — regenerar con `xcodegen generate`.
# El .xcodeproj NO se versiona (ver .gitignore).
name: FisuEvolution
options:
  bundleIdPrefix: com.manuader
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
packages:
  EconomyKit:
    path: Packages/EconomyKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Development team (Personal Team gratis de Manuel Ader). Necesario para
    # firmar en dispositivo físico; el simulador no lo requiere. Va acá y no en la
    # UI de Xcode porque el .xcodeproj se regenera con `xcodegen generate`.
    DEVELOPMENT_TEAM: 2TS7P7VDQJ
    # Sin AppIntents en ningún target; silencia el aviso del metadata processor
    # para que el criterio "cero warnings" sea chequeable por grep.
    ENABLE_APP_INTENTS_METADATA: NO
targets:
  FisuEvolution:
    type: application
    platform: iOS
    sources:
      - FisuEvolution
      # El .storekit viaja en el bundle para que la tienda local funcione en
      # builds lanzadas SIN Xcode (simctl, tocar el icono): el
      # `storeKitConfiguration` del scheme sólo se inyecta cuando Xcode lanza
      # la app, y sin él StoreKit devuelve el catálogo vacío — la tienda
      # mostraba "sin conexión" para siempre (lo vio el dueño, 2026-08-18).
      # Quien lo usa es el bootstrap DEBUG de `StoreManager` (SKTestSession);
      # en Release el archivo es un JSON inerte de ~4 KB.
      - path: StoreKitConfig/FisuEvolution.storekit
        buildPhase: resources
    dependencies:
      - package: EconomyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manuader.fisuevolution
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # ⚠️ Esta clave sola NO oculta nada, y durante meses no ocultó nada.
        # `UIStatusBarHidden` sólo se respeta si `UIViewControllerBasedStatusBarAppearance`
        # es NO, y esa viene en YES de fábrica: manda el view controller, no el
        # Info.plist. Y la clave compañera **no se puede escribir desde acá** —
        # Xcode sólo traduce a Info.plist una whitelist de 85 `INFOPLIST_KEY_*`
        # (medida sobre Xcode 16.4: de la barra de estado sólo conoce
        # `UIStatusBarHidden` y `UIStatusBarStyle`). Puesta igual, se queda en el
        # .pbxproj y el Info.plist compilado sale sin ella, en silencio.
        #
        # Así que quien oculta la barra de verdad es `RootView.statusBarHidden(true)`,
        # que es el mecanismo que el default (VC-based) espera. Esta clave se queda
        # porque describe la intención y cubre la ventana de lanzamiento, pero
        # **no es la que manda**: si algún día vuelve a aparecer el reloj, el
        # lugar donde mirar es `RootView`, no este archivo.
        INFOPLIST_KEY_UIStatusBarHidden: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
      configs:
        Debug:
          # StoreKitTest (la tienda local DEBUG de `StoreManager`) vive en
          # `$(SDKROOT)/Developer/Library/Frameworks`, fuera de los search
          # paths de un target de app. Sólo Debug lo importa (`#if DEBUG`),
          # así que sólo Debug lo busca; en Release no hay import y el
          # autolink —que sigue al import— tampoco lo linkea.
          ENABLE_TESTING_SEARCH_PATHS: YES
          # ⚠️ WEAK y no fuerte: StoreKitTest depende de XCTest, que fuera del
          # entorno de tests (o de un bundle que los embeba) NO está en ningún
          # rpath — con el link fuerte, una instalación a pelo por `simctl`
          # ABORTABA EN DYLD al lanzar ("Library not loaded: XCTest", medido
          # 2026-08-18). Débil, dyld tolera la falta y `StoreManager` pregunta
          # por la clase antes de tocarla: sin frameworks la app arranca igual
          # y la tienda cae al camino de siempre.
          OTHER_LDFLAGS: -weak_framework StoreKitTest
          # Y estos DOS rpaths son los que hacen que la tienda local funcione
          # también instalada a pelo: XCTest (la dependencia de StoreKitTest) y
          # sus re-exports (XCTestCore, XCUIAutomation) viven en el platform
          # dir del HOST, que un proceso del simulador puede cargar — es
          # exactamente lo que el runner de tests inyecta por DYLD_* cuando
          # corre la suite. Rutas absolutas de esta máquina horneadas en el
          # binario de DEBUG: en otra máquina con Xcode en otro lado, el weak
          # link de arriba degrada limpio (app viva, tienda sin catálogo).
          LD_RUNPATH_SEARCH_PATHS: $(inherited) $(PLATFORM_DIR)/Developer/Library/Frameworks $(PLATFORM_DIR)/Developer/Library/PrivateFrameworks
    # Entitlements futuros (F6, detrás de feature flags — NO habilitar antes):
    #   com.apple.developer.game-center, iCloud/CloudKit container
  FisuEvolutionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FisuEvolutionTests
      # SKTestSession(configurationFileNamed:) busca el .storekit en el bundle de tests.
      - path: StoreKitConfig/FisuEvolution.storekit
        buildPhase: resources
    dependencies:
      - target: FisuEvolution
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FisuEvolutionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FisuEvolutionUITests
    dependencies:
      - target: FisuEvolution
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FisuEvolution
schemes:
  FisuEvolution:
    build:
      targets:
        FisuEvolution: all
    run:
      config: Debug
      storeKitConfiguration: StoreKitConfig/FisuEvolution.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FisuEvolutionTests
        - FisuEvolutionUITests
