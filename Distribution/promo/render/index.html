<!doctype html>
<html lang="es">
<head>

<title>FisuEvolution — Reel</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="lib.js"></script>
<script>
  // ?v=2 carga el reel v2; por defecto, el v1.

    const v = new URLSearchParams(location.search).get('v');

    s.src = v === '2' ? 'scene2.js' : 'scene.js';
    document.body.appendChild(s);
  })();
</script>
